<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polish BPE</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/tokenizer/style.css">
<header><label>Tokenizer<select id="tokenizer"><option value="workshop">Polish Wikipedia (8,192 tokens)</option><option value="cl100k_base">GPT-4 (cl100k_base)</option><option value="o200k_base">GPT-4o (o200k_base)</option><option value="custom">Load tokenizer.json…</option></select></label><label>Text<select id="example"></select></label><span id="count" aria-live="polite"></span></header>
<input id="tokenizer-file" type="file" accept=".json,application/json" hidden>
<div id="text" contenteditable="plaintext-only" role="textbox" aria-label="Text to tokenize" aria-multiline="true" spellcheck="false"></div>
<p id="error" role="alert"></p>
<div class="controls"><div class="labels"><label for="step">Bytes</label><span>Tokens</span></div><input id="step" type="range" min="0" value="0" aria-label="BPE merges: bytes to full merges"></div>
<footer><a href="https://www.cs.cornell.edu/courses/cs4782/2026sp/demos/bytepair/">Cornell: interactive BPE / WordPiece visualizer</a></footer>
<aside id="hover" hidden role="tooltip"></aside>
<script type="module" src="/tokenizer/app.js"></script>
</html>
